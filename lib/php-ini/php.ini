; Staged by --php-extension before php_wasm_init so initializeRuntime
; skips its default. Resource limits are PHP compiled defaults so
; Playground padding cannot hide faults. Logging stays on.
; auto_prepend_file and session.save_path are Playground runtime.
; OPcache lines are the operator list plus file-cache paths.
auto_prepend_file=/internal/shared/auto_prepend_file.php
memory_limit=128M
ignore_repeated_errors = 0
error_reporting = E_ALL
display_errors = 1
html_errors = 1
display_startup_errors = On
log_errors = 1
upload_max_filesize = 2M
post_max_size = 8M
allow_url_fopen = On
allow_url_include = Off
session.save_path = /home/web_user
implicit_flush = 1
output_buffering = 0
max_execution_time = 0
max_input_time = -1
opcache.enable = 1
opcache.enable_cli = 1
opcache.jit = 0
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 7963
opcache.memory_consumption = 256
opcache.max_wasted_percentage = 5
opcache.revalidate_freq = 5
opcache.validate_root = 1
opcache.jit_buffer_size = 256M
opcache.file_cache = /internal/shared/opcache
opcache.file_cache_only = 0
opcache.file_cache_consistency_checks = 1
